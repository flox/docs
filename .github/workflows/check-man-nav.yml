name: Check man page nav coverage

# docs.json nav entries are maintained by hand while man/*.mdx is synced
# from flox/flox, so the two can drift in either direction: a new command's
# page can ship without a sidebar link, and a page retired upstream can
# leave a nav entry that 404s. Fail PRs that introduce either mismatch.
on:
  pull_request:
    paths:
      - 'man/**'
      - 'docs.json'
      - 'scripts/check-man-nav.sh'
  workflow_dispatch:

jobs:
  check-man-nav:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check nav coverage
        run: ./scripts/check-man-nav.sh
